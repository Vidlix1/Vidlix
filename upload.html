<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload - ClipAI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
      min-height: 100vh;
    }

    nav {
      padding: 24px 7%;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #8b5cf6;
    }

    .container {
      max-width: 800px;
      margin: 100px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #999;
      font-size: 18px;
      margin-bottom: 45px;
    }

    .upload-box {
      border: 2px dashed #444;
      border-radius: 20px;
      padding: 70px 30px;
      background: #111;
      transition: 0.2s;
    }

    .upload-box:hover {
      border-color: #8b5cf6;
    }

    .upload-icon {
      font-size: 50px;
      margin-bottom: 20px;
    }

    input[type="file"] {
      display: none;
    }

    .upload-button {
      display: inline-block;
      background: #8b5cf6;
      padding: 15px 28px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    .upload-button:hover {
      background: #7c3aed;
    }

    #file-name {
      color: #aaa;
      margin-top: 20px;
    }

    .info {
      margin-top: 25px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">Clip<span>AI</span></div>
  </nav>

  <div class="container">

    <h1>Upload your video</h1>

    <p class="subtitle">
      Upload a long video and let ClipAI find the best moments.
    </p>

    <div class="upload-box">

      <div class="upload-icon">🎬</div>

      <h2>Drop your video here</h2>

      <p style="color:#777; margin-top:10px;">
        or choose a file from your device
      </p>

      <label for="video-upload" class="upload-button">
        Choose Video
      </label>

      <input
        id="video-upload"
        type="file"
        accept="video/*"
      >

      <div id="file-name"></div>
<button id="analyze-button" style="
  display: none;
  margin-top: 25px;
  background: #8b5cf6;
  color: white;
  border: none;
  padding: 15px 30px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  font-size: 16px;
">
  Analyze Video
</button>

<div id="status" style="
  margin-top: 20px;
  color: #aaa;
"></div>

    </div>

    <p class="info">
      Supported formats: MP4, MOV, WebM
    </p>

  </div>

  <script>
const upload = document.getElementById("video-upload");
const fileName = document.getElementById("file-name");
const analyzeButton = document.getElementById("analyze-button");
const status = document.getElementById("status");

upload.addEventListener("change", function () {
  if (upload.files.length > 0) {
    fileName.textContent = "Selected: " + upload.files[0].name;
    analyzeButton.style.display = "inline-block";
    status.textContent = "";
  }
});

analyzeButton.addEventListener("click", async function () {
  const file = upload.files[0];

  if (!file) {
    status.textContent = "Please select a video first.";
    return;
  }

  status.textContent = "⏳ Uploading video...";
  analyzeButton.disabled = true;

  const formData = new FormData();
  formData.append("video", file);

  try {
    const response = await fetch(
      "https://vidlix.onrender.com/upload",
      {
        method: "POST",
        body: formData
      }
    );

    const data = await response.json();

    if (response.ok) {
      status.textContent = "✅ Video uploaded successfully!";
    } else {
      status.textContent = "❌ Upload failed: " + data.error;
    }
  } catch (error) {
    status.textContent = "❌ Could not connect to Vidlix server.";
  }

  analyzeButton.disabled = false;
});
</script>

</body>
</html>
